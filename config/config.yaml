# ============================================================================
# G4_Promoter_Pipeline — unified configuration
#
# Every threshold, path and parameter used by the workflow lives here; the
# scripts read nothing from the environment. All paths are relative to the
# repository root (the Snakemake working directory).
#
# Peaks and regions are recomputed by the Stage-B rules into ./cache, so the
# whole workflow reproduces from the public bigWigs + count table alone;
# `paths.cache_v2` therefore points at this repository's own `cache/`.
#
# Smoke test: set `peak_subsample: 2000` at the bottom of this file for a fast
# end-to-end pass, then set it back to `null` for the real run.
# ============================================================================

# ---- Input / output locations ---------------------------------------------
paths:
  # This pipeline's own cache (Stage B writes peaks_*.rds + regions_*.rds here).
  cache_v2:      "cache"
  # The 28 CUT&Tag bigWigs (12 G4 + 8 R-loop + 8 ERCC), fetched from GEO GSE269084
  # by scripts/download_data.ps1 (or .sh). To read an existing copy in place
  # instead, copy config/config.local.example.yaml to config/config.local.yaml,
  # point it at your directory, and run:
  #   snakemake --cores 4 --configfile config/config.local.yaml
  bigwig_dir:    "data/bigwig"
  # Promoter GRanges (TSS +/- 2 kb), now built by Stage B rule 08 into cache/.
  promoters_rds: "cache/regions_promoter.rds"
  # Upstream model repos (git-ignored, read-only). g4sp_repo is required by the
  # G4ShapePredictor python rules (20, 26a, 26b, 42) and is cloned by
  # scripts/download_data.sh. deepg4_repo is NOT read by any rule — the DeepG4
  # CNN comes from the R package (remotes::install_github("raphaelmourad/DeepG4"));
  # the key is kept only for provenance.
  deepg4_repo:   "external/DeepG4"
  g4sp_repo:     "external/G4ShapePredictor"

# ---- Biology --------------------------------------------------------------
genome: mm10
assay:  G4_BG4                       # topology sub-pipeline is G4-focused (BG4)
genotypes: [WT, DHX36KO, FANCJKO, dKO]
ref_genotype: WT
std_chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
             chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chrX]

# ---- Stage A: RNA-seq (analysis_V2 §2-4) ----------------------------------
rnaseq:
  count_table: "data/rnaseq/GSE269081_count_table.tsv"   # GEO GSE269081
  min_count: 10                       # rowSum >= keep
  padj: 0.05                          # DEG significance
  lfc: 0.5                            # DEG |log2FC| threshold (project standard)
  lfc_shrink: true                    # ashr shrinkage
  # count-table sample-column prefix -> genotype
  sample_map: {WT: WT, D: DHX36KO, J: FANCJKO, DJ: dKO}
  # 5 DESeq2 contrasts as [numerator, denominator] genotype pairs
  contrasts:
    - [DHX36KO, WT]
    - [FANCJKO, WT]
    - [dKO, WT]
    - [dKO, DHX36KO]
    - [dKO, FANCJKO]
  volcano_top_n: 15                   # labelled genes per EnhancedVolcano
  go_pvalue: 0.05                     # enrichGO cutoff
  go_show: 15                         # categories shown per dotplot
  gsea_minsize: 15
  gsea_maxsize: 500
  gsea_targeted_minsize: 10
  gsea_targeted_maxsize: 1000
  # targeted-pathway regexes (C5 GO:BP) for the dKO deep-dive (analysis_V2 §4c)
  targeted_patterns:
    - "DNA_REPAIR"
    - "DNA_DAMAGE"
    - "REPLICATION_STRESS"
    - "ATR|ATM"
    - "QUADRUPLEX|G_QUADRUPLEX"
    - "R_LOOP|RNA_DNA_HYBRID"

# ---- Stage B: peak calling (extended_V3 §2) -------------------------------
peak_calling:
  bin_size: 500
  z_thresh: 2
  min_replicates: 2                   # G4 has 3 reps -> 2; R-loop 2 -> 2
  gap_bp: 500
  # v1.1 (2026-08-07 audit): WAS 500, i.e. exactly bin_size, which made the
  # width filter inert -- every merged seed is already >= one bin wide.
  # Requiring two bins means a peak must be supported by more than a single
  # 500 bp window.
  min_width: 1000
  # v1.1 NEW. Z-score each replicate independently and require z >= z_thresh in
  # >= min_replicates of them, instead of z-scoring the replicate MEAN once and
  # separately checking "coverage > 0 in >= 2 replicates" (which at CUT&Tag
  # depth is close to a no-op, so one strong replicate could carry a bin).
  # Set false to reproduce v1.0 exactly.
  #
  # Evidence this matters: under the v1.0 rule the ERCC CONTROL tracks yield
  # MORE peaks than the real samples (G4_BG4_ERCCKO 114,980 vs G4_BG4_WT
  # 107,276) -- a relative global z has no null in which a peak can fail.
  z_per_replicate: true
  assays: [G4_BG4, Rloop_S96]
  # full genotype set incl. ERCC controls (main + ERCC unions built separately)
  genotypes: [WT, DHX36KO, FANCJKO, dKO, ERCCWT, ERCCKO]

# ---- Stage B: region building (extended_V3 §3) ----------------------------
regions:
  promoter_up: 2000
  promoter_down: 2000
  # ENCODE SCREEN V3 mm10 cCRE candidate URLs (distal-ELS kept); UCSC REST fallback.
  enhancer_urls:
    - "https://downloads.wenglab.org/Registry-V3/GRCm38-cCREs.bed"
    - "https://www.encodeproject.org/files/ENCFF846BKF/@@download/ENCFF846BKF.bed.gz"

# ---- Stage C: genome-wide CUT&Tag QC (analysis_V2 §5) ---------------------
genomewide:
  window: 1000                        # 1 kb genome tiles
  subsample: 500000                   # windows kept (Windows memory)
  subsample_seed: 42
  violin_subsample: 50000             # nonzero windows per sample for the violin
  scatter_subsample: 50000            # windows per genotype for G4-vs-Rloop scatter

# ---- Stage D: regional enrichment (extended_V3 §3) ------------------------
regional:
  region_signal_n: 5000               # regions/class subsample for signal boxplot
  region_signal_seed: 123
  profile_n: 2000                     # regions/class for the metaprofile
  profile_seed: 7
  profile_full_cap: 4000              # cap for the full-peak validation metaprofile
  profile_full_seed: 8
  n_bins: 80
  half_width: 2000

# ---- Stage E: RNA x CUT&Tag integration (analysis_V2 §6) ------------------
integration:
  promoter_half_width: 2000           # TSS +/- for promoter signal boxplots
  tss_half_width: 5000                # TSS +/- for TSS profiles
  tss_n_bins: 100
  top_degs: 500                       # top up + top down DEGs per KO-vs-WT

# ---- Stage L: strand asymmetry (g4_gloop_strand_analysis.Rmd s1-s8) -------
strand:
  window_sizes: [250, 500]            # +/- bp around peak centre for G4Hunter
  # v1.1 (2026-08-07 audit): WAS 0.0, which made `has_g4_motif = abs(score) >= 0`
  # TRUE for every row -- g4_detection_by_strand.tsv read 100% in all 32 rows
  # and could not report anything.
  #
  # The audit asked for "a real G4Hunter cutoff (1.2 conventional, 1.5
  # stringent)". Neither works here, for two DIFFERENT reasons, both measured
  # (verify/test_g4hunter.R, verify/calibrate_g4_threshold.R):
  #
  #   - Against the v1.0 WINDOW-MEAN statistic, 1.2 calls nothing: observed
  #     scores span 0.088-0.153 and 0/10 literature control G4s pass. The table
  #     would have broken in the opposite direction.
  #   - Against the v1.1 SLIDING-25nt-MAX statistic, 1.2 is far too permissive
  #     as a per-window classifier: measured against 5,000 random mm10 windows
  #     the false-positive rate is 0.441 at 501 bp and 0.635 at 1001 bp
  #     (1.5 gives 0.230 / 0.396). The published cutoffs are genome-SCANNING
  #     thresholds for locating candidate sites, not per-locus decisions.
  #
  # So the threshold is CALIBRATED per window size to a stated false-positive
  # rate. Leave null to calibrate; set a number to override and skip
  # calibration (the FPR is then unknown and is reported as such).
  # Calibrated values on mm10: window_size 250 (501 bp) -> ~2.28;
  # window_size 500 (1001 bp) -> ~2.60. They differ because a max over more
  # windows is a larger extreme value, which is why one fixed number cannot
  # serve both sizes.
  g4_threshold: null
  g4_threshold_fpr: 0.05              # target FPR vs random mm10 windows
  calib_n: 5000                       # background windows drawn per window size
  calib_seed: 2026
  subsample: 2000                     # peaks/genotype (promoter + 5'UTR only)
  seed: 2026
  region_types: [promoter, 5UTR]
  n_bins: 100                         # strand metaprofile bins
  half_width: 2000                    # strand metaprofile TSS +/-
  # -- v1.2: mirrored, region-centred metaprofiles ---------------------------
  # Replaces the three old metaprofile figures. Two things were wrong with them
  # beyond the layout. (a) They were START-anchored: prof_matrix() built its
  # window from start(peak) - half_width, so a 200 bp and a 2 kb peak were
  # aligned by their left edge and the "centre" of the plot was not the G4.
  # (b) SEM was taken across the 3 replicates (n = 3), which makes the ribbon a
  # statement about library reproducibility, not about the region set.
  # The replacement anchors on the REGION centre (= the TSS for promoters, the
  # 5'UTR midpoint for 5'UTRs) via the shared helpers, so it sits on the same
  # grid as rules 24/30/31, and derives every stratum by row-subsetting one
  # replicate-averaged matrix per genotype (rep_mean_matrix()).
  mirror_window_size: 250             # which G4Hunter window defines the call;
                                      # must be one of window_sizes above
  mirror_min_regions: 20              # curves below this n are recorded but not
                                      # drawn (n is written before the guard, so
                                      # a missing curve is explained not absent)

# ---- Stage L: Gviz locus tracks (strand chunk s9-gviz-gene-loci) ----------
gviz:
  # mode "genes" plots the curated list below; "peaks" restores the v1.0
  # behaviour of sampling n_loci peaks by |G4Hunter score| quantile. Default is
  # "genes" because the purpose of this figure is to show NAMED loci on a
  # poster, and a score-ranked sample cannot be asked for a specific gene.
  mode: genes
  # mm10 SYMBOLS. Checked against org.Mm.eg.db and TxDb.Mmusculus.UCSC.mm10 on
  # 2026-09-15: all ten resolve to exactly one Entrez id with a single-strand
  # gene range. The list was supplied in human/colloquial nomenclature, which
  # does NOT match what TxDb indexes -- these are the mouse orthologues:
  #   KRAS  -> Kras    HRAS   -> Hras    BCL2   -> Bcl2   cKIT -> Kit
  #   cMYC  -> Myc     VEGF   -> Vegfa   HIF1a  -> Hif1a  cMYB -> Myb
  #   PDGF-A-> Pdgfa   hTERT  -> Tert
  # Two are judgement calls worth recording: mouse has Vegfa/b/c/d and Vegfa is
  # the canonical "VEGF"; TERT carries no species prefix in mouse. The script
  # STOPS on a name it cannot resolve rather than writing a blank panel -- a
  # silently empty locus track is the failure mode this list exists to avoid.
  genes: [Kras, Hras, Bcl2, Kit, Myc, Vegfa, Hif1a, Pdgfa, Tert, Myb]
  # Two views per gene, because no single window serves both purposes: the loci
  # span 4.9 kb (Hras) to 176 kb (Bcl2), a 36x range.
  #   tss   -- TSS +/- padding. Identical bp-per-inch for every gene, so peak
  #            widths and heights ARE comparable across genes; the TES is off
  #            screen for all but the shortest.
  #   locus -- whole gene +/- gene_flank. Always shows TSS and TES, but the
  #            scale differs per gene, so a 200 bp G4 peak is a hairline in Bcl2.
  views: [tss, locus]
  n_loci: 5                           # mode "peaks" only
  padding: 5000                       # "tss" view: bp each side -> 10 kb window
  gene_flank: 2000                    # "locus" view: bp each side of the gene
  replicate: 1                        # use rep-1 bigWig per genotype
  ideogram_cache: "cache/ideogram_mm10.rds"  # offline cytoband cache

# ===========================================================================
# BELOW: parameters for the sequence-level topology, metaprofile, motif, lncRNA
# and G4 x R-loop rules (Stages F-K). Rule numbers quoted in the section
# headers refer to the numbered scripts in scripts/.
# ===========================================================================

# ---- Sequence extraction (DeepG4 rule 02 -> new 18) -----------------------
sequences:
  deepg4_width: 201
  background_n: 20000
  background_seed: 42
  gc_bins: 20

# ---- pqsfinder ------------------------------------------------------------
pqsfinder:
  min_score: 20
  strand: "*"

# ---- DeepG4 (formation-probability sanity check) --------------------------
deepg4:
  reticulate_condaenv: "tf-new"

# ---- G4ShapePredictor -----------------------------------------------------
g4sp:
  conda_env: "g4sp"
  model: "RandomForest (default).pkl"
  threshold_file: "(precision)optimized_threshold.pkl"
  # UNCHANGED at 0.80, but in v1.1 the MEANING changed: script 21 no longer
  # back-fills G4SP's abstentions with the loop-length heuristic, so this now
  # genuinely controls how many peaks land in the terminal "mixed" stratum
  # rather than how many silently get a heuristic label.
  # From topology_precision_sweep.csv:
  #   default -> n_mixed =      0  (argmax; no abstention), 11,062 hybrid
  #   0.75    -> n_mixed =  6,090  (4.7%),                   7,912 hybrid
  #   0.80    -> n_mixed = 29,225  (22.3%),                  1,879 hybrid  <- primary
  #   0.85    -> n_mixed = 64,960  (49.6%),                     37 hybrid
  # Hybrid is by far the least confident G4SP class and collapses fastest, so
  # the choice of precision IS the choice of how big the hybrid stratum is.
  precision: 0.80
  # v1.1 NEW: the confidence-stratified sensitivity arm. Script 21b recomputes
  # topology at this setting from the per-class probabilities already in
  # g4sp_topology.csv (plain argmax, no G4SP re-inference), so the
  # "hybrid > parallel > antiparallel" TSS ordering can be reported both ways.
  sensitivity_precision: default

# ---- Loop-length topology heuristic ---------------------------------------
heuristic:
  parallel_max_loop: 3
  antiparallel_min_long_loops: 2

# ---- Differential peak signal (gain/loss) ---------------------------------
differential:
  voom_padj: 0.1
  voom_lfc:  0.585

# ---- Topology meta-profiles (DeepG4 rules 08/14/15/16/17/24) --------------
metaprofile:
  half_width: 2000
  n_bins: 80
  include_none_group: true
  max_per_group: 16000
  # Minimum regions a (topology, direction) stratum needs before it is profiled.
  # Was hard-coded 5 in rules 31/32, which silently deleted whole facet rows once
  # rule 21 stopped back-filling G4SP's abstentions. Sparse strata are now drawn
  # with their n annotated; only 0-region strata are skipped (they cannot be
  # profiled at all).
  min_regions_per_panel: 1
  normalize_promoter_to_none: true
  feature_regions: ["promoter", "5UTR", "intron1", "enhancer"]
  feature_fixed_ymax: 30
  total_feature_regions: ["promoter", "5UTR", "intron1", "enhancer", "lncRNA"]
  deg_half_width: 2000
  deg_padj: 0.05
  deg_lfc:  0.5
  deg_grid_kos: ["DHX36KO", "dKO"]
  deg_fixed_ymax: 28
  deg_5utr_grid_ymax: 40

  # ---- Rules 50/51: TSS metaprofiles by RNA-seq expression quartile --------
  # Window and binning are INHERITED from metaprofile.half_width (2000) and
  # metaprofile.n_bins (80) above, so these figures sit on the same grid as
  # rules 24/30/31 and the profile cache filename tracks those two keys.
  expr_n_quantiles: 4            # 4 -> Q1..Q4. Every label/colour follows.
  expr_per_genotype: true        # true : each genotype's own 3 rlog replicates
                                 #        define its own cuts. Genes move between
                                 #        quartiles across panels -- intentional,
                                 #        and bounded: measured 2026-09-01, 94.5%
                                 #        (WT vs dKO) / 95.3% (WT vs DHX36KO) of
                                 #        genes keep their quartile, and the
                                 #        cross-tab is strictly tridiagonal, so
                                 #        every mover moves exactly one quartile.
                                 # false: ref_genotype cuts applied to all panels.
  expr_fixed_cuts_arm: true      # ALSO render the expr_per_genotype = false arm
                                 # as a sensitivity figure. Costs no bigWig I/O
                                 # (another row subset of the same cache) and is
                                 # what separates a real KO positional shift from
                                 # a quartile-relabelling artefact.
  expr_quantile_basis: matched   # "matched": cuts from the 15096 DESeq2 genes
                                 #   that HAVE a promoter -> 3774 per quartile,
                                 #   so all four curves carry the same n.
                                 # "all": cuts from all 16981, then subset ->
                                 #   3101 / 3819 / 4068 / 4108.
  expr_include_silent: true      # 5th curve: promoters whose gene IS in the raw
                                 # count table but was dropped by rnaseq.min_count
                                 # (rowSums over all 12 libraries < 10). n = 5595.
  expr_silent_from_counts: true  # read rnaseq.count_table to separate "truly
                                 # silent" (5595) from "symbol absent from the
                                 # RNA-seq vocabulary" (3773, expression UNKNOWN
                                 # -> dropped and counted, never merged into
                                 # silent: a curve that is 40% unknown cannot
                                 # support a positional claim). If the file is
                                 # unreadable the silent group is dropped with a
                                 # warning rather than being widened.
  expr_shape_normalise: true     # companion figure: each curve / its own mean
                                 # across the window, isolating POSITION from
                                 # amplitude (expression correlates with open
                                 # chromatin, so amplitude ordering is expected).
  expr_silent_linetype: "22"     # dashed, so "silent" is not misread as a 5th
                                 # quantile of the same continuum. "solid" to off.
  # Quartile ramp: blue = least active -> red = most active. Interpolated to
  # expr_n_quantiles, so these 4 anchors ARE the colours at the default n = 4.
  # Deliberately jumps the pale centre a standard diverging palette passes
  # through (RdBu's #F7F7F7 neighbours): every quartile stays saturated enough
  # to read on a poster, which the viridis original's yellow/light-green did not.
  expr_palette: ["#2166AC", "#4393C3", "#D6604D", "#B2182B"]
  expr_silent_colour: "grey55"   # OFF the ramp on purpose: "silent" is the
                                 # no-expression floor, not a fifth quantile of
                                 # the same continuum (hence also the dashed
                                 # line). Set to a blue to fold it into the ramp.
  expr_min_regions_per_panel: 1  # curves below this n are not drawn; the panel
                                 # still appears (drop = FALSE) with its n, so
                                 # "no data" reads differently from "no signal".
                                 # Bites only rule 51 (antiparallel = 68 and
                                 # no_canonical_PQS = 56 promoters in TOTAL).
                                 # Was 20, which left the antiparallel and
                                 # no-canonical-PQS rows entirely blank (n = 1-17
                                 # per panel) and so read as "zero signal" rather
                                 # than "few promoters" -- worse, an empty panel
                                 # has no y-scale, so its n annotation had
                                 # nowhere to land and vanished too. At 1 every
                                 # panel draws its curve AND its n. Sparse curves
                                 # are noisy by construction and an n = 1 panel
                                 # has no ribbon (sd of one value is NA); the
                                 # per-panel n is what keeps that honest.
  expr_verify_equivalence: true  # rule 50 re-profiles one 400-region sample via
                                 # mean_replicate_profile() while the bigWigs are
                                 # still hot and asserts the cached path
                                 # reproduces it at tolerance 0 (~15 s/genotype).
  expr_rebuild_cache: false
  # -- Stage N (rules 52/53): TSS -> TES gene metaprofiles, COMPOSITE axis -----
  # Same analysis as rules 50/51 with the window widened from "TSS +/- 2 kb" to
  # the whole transcription unit.
  #
  # v2 (2026-09-15): the pure scale-regions layout was REPLACED because it was
  # misleading. It put 50 bp flank bins next to body bins of median 323 bp -- a
  # 6.5x resolution step at exactly the TSS -- and that step, not biology, drew
  # the vertical cliff at the TSS in every v1 figure. Measured on the same genes
  # and the same bigWigs at a flat 50 bp (rule 50): TSS -25 bp = 4.59,
  # +25 bp = 4.53, +275 bp = 3.58, +530 bp = 2.95. G4 signal carries ~500 bp
  # PAST the TSS and decays smoothly; v1 reported that whole decay as two
  # numbers (3.67, 2.96). And a v1 body bin was the gene's own length / 60, so
  # it meant a different distance for every gene: 32 bp at the 5th percentile,
  # 323 bp median, 3,352 bp at the 95th, 597 kb at the max. 37% of genes had a
  # first body bin wider than the 500 bp decay. The median mm10 5'UTR is 161 bp
  # and 68.9% of genes had a first body bin wider than that, so the 5'UTR had no
  # dedicated bin anywhere on the axis.
  #
  # v2 scales ONLY the deep interior. Both anchors are fixed bp at a fixed bin
  # size, which makes the TSS block directly comparable to rule 50's figure:
  #   [TSS-W .. TSS+W]   [ interior, scaled ]   [TES-W .. TES+W]
  #     real bp, 50 bp        NOT bp                real bp, 50 bp
  expr_gene_anchor_window: 2000 # bp each side of BOTH the TSS and the TES.
                                # 2000 on purpose: it matches metaprofile
                                # half_width, so the TSS block of these figures
                                # and rule 50's tss_signal_by_expression sit on
                                # the same grid and can be overlaid.
  expr_gene_anchor_bin: 50      # bp per anchor bin -> 80 bins per anchor block.
                                # Same 50 bp as rule 50's 80 bins over +/-2 kb.
  expr_gene_body_bins: 60       # bins for the SCALED INTERIOR only (not the
                                # whole body any more). Interior = the gene minus
                                # both anchor windows; median 365 bp per bin.
  expr_gene_min_interior: 1000  # the two anchor windows must not overlap, and a
                                # sliver of interior between them would be noise.
  # Floor implied by the layout: 2*anchor_window + min_interior = 5000 bp.
  # MEASURED COST of that floor (2026-09-15) -- stated here because it is the
  # one real price of the v2 axis and it is NOT uniform across the groups:
  # (Counted against the v1 gene set, i.e. the 1 kb floor. The script's runtime
  #  message counts against rule 50's full 24,464-promoter universe instead, so
  #  its numbers are larger -- e.g. silent -1,602 there vs -1,273 here -- because
  #  that universe also contains the sub-1 kb genes v1 had already excluded.)
  #   21,946 genes (v1, 1 kb floor) -> 18,219 genes (83.0%)
  #   dropped: silent 1,273 (24.2%), Q1 603 (16.1%), Q2 421 (11.2%),
  #            Q3 314 (8.3%), Q4 420 (11.2%)
  # Silent genes are shorter (median 13.4 kb vs 23.7-31.2 kb for the quartiles),
  # so the floor reweights that curve hardest. Script 52 writes the per-group
  # attrition into gene_body_expression_counts.csv and names it in the figure
  # subtitle rather than letting the composition shift silently. Short genes are
  # not lost to the project -- rule 50 profiles them at the TSS with no floor.
  expr_gene_min_length: 5000
  # Length tertiles. The interior is still scaled, so a bin there is still a
  # different distance for a 5 kb gene than for a 500 kb one; splitting the
  # figure by gene-length tertile makes that confound visible instead of
  # assumed. It also separates it from expression, which correlates with length
  # (median: silent 20.6 kb, Q1 25.9, Q2 28.7, Q3 31.2, Q4 27.4 kb).
  expr_gene_length_strata: 3
  # Neutral grey ramp on purpose: the length figure is a DIAGNOSTIC (is the
  # interior scaling distorting the comparison?), not a biological result, and a
  # third coloured ramp next to the G4 and R-loop ones would read as a third
  # assay. Ordered dark = long.
  expr_length_palette: ["#BDBDBD", "#737373", "#252525"]
  expr_gene_rebuild_cache: false      # true forces the ~30 min bigWig pass even when
                                 # the cache exists and validates.

  # ---- Stage N, second assay + genotype-overlay figures -------------------
  # Rule 52 runs the SAME scaled gene-body pass for every assay listed here,
  # one cache per assay (the cache name already carries the assay, so the two
  # cannot collide). Rule 53 reads only the G4_BG4 cache -- topology is a
  # property of a G4 peak, so there is no R-loop topology figure.
  #
  # Cost of the second assay, measured 2026-09-15 on the G4 pass: ~12 s to load
  # one RleList plus ~1.2 s to bin 21,946 genes. R-loop is 8 bigWigs against
  # G4's 12, so ~1.8 min on top of G4's ~2.6 min. Drop Rloop_S96 from this list
  # to go back to the G4-only rule; nothing else needs changing.
  expr_gene_assays: [G4_BG4, Rloop_S96]

  # R-loop quartile ramp. DELIBERATELY not the blue->red of expr_palette: these
  # figures sit next to the G4 ones in a talk and the assay must be readable
  # from the colour alone, without reading the title. PuOr (purple -> orange),
  # so it is colourblind-safe and keeps the same dark-is-low reading direction
  # as the G4 ramp. Interpolated to expr_n_quantiles the same way expr_palette
  # is, so these 4 anchors ARE the colours at the default n = 4.
  # Rejected: viridis (Q4 lands on yellow, unusable on a poster) and teal ->
  # magenta (teal reads as blue at projector line widths).
  expr_rloop_palette: ["#542788", "#998EC3", "#F1A340", "#B35806"]

  # Genotype overlay: all profiled genes, no expression split, one curve per
  # genotype on a single panel. Okabe-Ito, which is categorical rather than
  # ordered -- correct here, because WT/DHX36KO/FANCJKO/dKO are not a ranked
  # scale, and it also keeps the overlay visually distinct from BOTH quartile
  # ramps. Order follows main_genotypes (WT, DHX36KO, FANCJKO, dKO).
  expr_gene_overlay: true
  expr_genotype_palette: ["#333333", "#0072B2", "#D55E00", "#CC79A7"]

# ---- All-PQS / multi-G4 motif analysis (DeepG4 rules 27-32) ---------------
motif_analysis:
  min_score: 20
  collapse_overlaps: true
  signal_half_width: 100
  promoter_half_width: 2000
  n_bins: 80
  count_buckets: [0, 1, 2, 3, 4]
  assign_motif_to: nearest_tss

# ---- Topology calibration (DeepG4 rule 10) --------------------------------
calibration:
  precision_grid: ["default", 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  controls_tsv: "data/known_topology_controls.tsv"

# ---- Genomic-feature partition (DeepG4 rule 11) ---------------------------
feature:
  region_files:
    promoter: "regions_promoter.rds"
    "5UTR":   "regions_5UTR.rds"
    intron1:  "regions_intron1.rds"
    genebody: "regions_genebody.rds"
    enhancer: "regions_enhancer.rds"

# ---- G4 x R-loop coupling (DeepG4 rule 12) --------------------------------
rloop:
  assay: "Rloop_S96"
  union_rds: "peaks_Rloop_S96_union.rds"
  propensity_bins: 4

# ---- RNA-seq expression integration (DeepG4 rules 13a/13b) ----------------
# NOTE: 13a (DESeq2) is REPLACED by Stage-A script 02, which writes the same
# `results/tables/deseq2_KO_vs_WT.csv` schema. These keys remain for the count
# read done by script 02 and any consumer that references cfg$expression.
expression:
  count_table: "data/rnaseq/GSE269081_count_table.tsv"
  min_count: 10
  lfc_shrink: true
  sample_map:
    WT: WT
    D:  DHX36KO
    J:  FANCJKO
    DJ: dKO

# ---- G4 vs R-loop promoter signal correlation (DeepG4 rule 25) ------------
g4_rloop_correlation:
  genotypes: [WT, DHX36KO, FANCJKO, dKO]
  mean_half_width: 2000
  bin_half_width: 1000
  bin_size: 200
  pseudocount: 1
  cnt_norm: background_median
  background_n: 20000
  background_seed: 7
  bin_subsample_n: 3000
  comparability: zscore
  hexbin: true
  hexbin_bins: 60          # hex resolution for BOTH scatters in this rule. The
                           # binned plot was ~120k vector points (3.5 MB PDF);
                           # hexed it is ~2k polygons and editable in Illustrator.

# ---- G4 vs R-loop promoter co-occurrence (DeepG4 rule 26) -----------------
g4_rloop_cooccurrence:
  genotypes: [WT, DHX36KO, FANCJKO, dKO]
  ref_genotype: WT
  half_width: 2000
  n_bins: 100
  pseudocount: 1
  cnt_norm: background_median
  background_n: 20000
  background_seed: 7
  n_strata: 4
  heatmap_genotypes: [WT]
  heatmap_max_rows: 5000
  heatmap_cap_z: 3
  voom_padj: 0.1
  voom_lfc: 0.585
  profile_subsample_n: null
  # -- density rendering (poster legibility; no effect on any statistic) -------
  hexbin: true
  hexbin_bins: 60          # delta-delta scatter: 73,449 points -> hex
  volcano_hex_classes: [stable, ambiguous]
                           # volcano: these classes are drawn as hex (the grey
                           # mass, ~70.7k points); gained/lost stay as real
                           # points (~2.8k) so the G4-class colouring survives.
  # -- TSS-window co-occurrence scatters (new) --------------------------------
  tss_scatter_half_width: 250   # "signal at the TSS" = mean of the bins within
                                # +/-250 bp. Deliberately NARROWER than the
                                # +/-2000 bp window that defines the quartiles,
                                # so the within-panel correlation is not just a
                                # range-restricted view of the cut variable.
  tss_scatter_hexbin_bins: 45   # panels hold ~6.1k promoters each, so fewer hexes
  tss_scatter_fill_limits: [1, 100]
  tss_scatter_fill_breaks: [1, 10, 100]
                                # FIXED and SHARED by all 16 panels, unlike the
                                # data-driven scale on the pooled scatters in
                                # rule 25. What washed the old version out was
                                # the CEILING, not the floor: the y=0 row (
                                # promoters with no R-loop signal at the TSS)
                                # piles into a few hexes holding up to ~2,000,
                                # which stretched the ramp so the real cloud sat
                                # in its bottom eighth. Measured counts per hex
                                # in a panel are median 3-5, 90th pct 10-19, so
                                # 1-100 is where essentially all the structure
                                # lives; the dropout row saturates at the top
                                # colour. oob = squish, so nothing is dropped.
                                # NB a 10-1000 range was tried and is worse:
                                # 68-89% of hexes per panel hold <10 promoters
                                # and would collapse into a single colour.

# ---- Unclassified (no-canonical-PQS) peak characterisation (rules 18-20) --
unclassified:
  rmsk_url: "https://hgdownload.gi.ucsc.edu/goldenPath/mm10/database/rmsk.txt.gz"
  rmsk_local: "data/rmsk_mm10.txt.gz"
  # v1.1 (2026-08-07 audit): WAS 16980 -- a hard-coded literal that happened to
  # equal the observed no_canonical_PQS peak count of the v1.0 run. A
  # run-specific magic number, not a parameter: any change upstream silently
  # desynchronised it. null now means "use all no-PQS peaks" (script 37).
  subsample: null
  motif_pcut: 5.0e-5
  jaspar_tax: "vertebrates"

# ---- Stage O: half-G4 sites in no-canonical-PQS peaks (rules 54-56) -------
# Question: are the 2,405 union peaks with no pqsfinder PQS >= 20 hybrid /
# intermolecular G4s -- i.e. do they carry HALF sites (2-3 G-tracts) that an
# RNA or another DNA strand could complete? Measured before building this
# (2026-09-24, crude G3.L1-7.G3 regex): no-PQS 0.44/kb, their own dinucleotide
# shuffle 0.46/kb, random mm10 2.51/kb, PQS peaks 3.34/kb. The rule makes that
# rigorous; it is built to be able to come out negative.
nopqs_half_g4:
  seed: 11
  # -- rule 54: comparator sets ----------------------------------------------
  # All four sets are the SAME size (n = no-PQS peaks) and width-matched, so
  # per-kb rates and DeepG4 window counts compare directly.
  max_n_frac: 0.1          # noPQS peaks above this N fraction are dropped from
                           # every set. Measured: 148 of 2,405 contain N and all
                           # are >= 57% N (145 are >= 99% -- peaks called inside
                           # mm10 assembly gaps, with no sequence to have a PQS).
                           # 0.1 is DeepG4's own filter, so 2,257 survive: exactly
                           # the set rule 19 scored.
  gc_bins: 20              # random_gc is matched to the no-PQS GC distribution
                           # in quantile bins, as rule 18 does for its background
  random_pool_mult: 40     # random windows drawn per target before GC matching.
                           # No-PQS peaks are AT-rich (median GC 0.36 vs 0.42
                           # genome-wide), so the low-GC bins are the ones that
                           # need the pool; shortfall is reported, never silent.
  random_pool_min: 20000   # per-width floor on that pool. Without it the rare
                           # 2-5 kb widths got 40-200 draws and the build came up
                           # 22 windows short, all in the < 0.30 GC bin.
  shuffle_k: 2             # dinucleotide shuffle = the PRIMARY null: same
                           # composition, CpG and G/C skew as the real peak, no
                           # positional structure. k = 1 would also destroy
                           # dinucleotide bias and overstate any enrichment.
  # -- rule 55: full-peak DeepG4 scan ---------------------------------------
  deepg4_step: 20          # 201 bp windows every 20 bp (DeepG4Scan's own k).
                           # ~41 windows per 1 kb peak. The existing rule-19
                           # score saw ONE midpoint window, ~19% of a no-PQS peak.
  deepg4_batch: 50000      # windows per DeepG4() call; bounds TF memory
                           # (one-hot 50k x 201 x 4 float32 = 160 MB)
  deepg4_prob_cuts: [0.25, 0.5, 0.75]   # 0.5 is DeepG4Scan's default threshold
  # -- rule 56: relaxed pqsfinder control -------------------------------------
  # Measured 2026-09-24 on 200 no-PQS peaks: best score median 15, 90th pct 19;
  # 80% have a PQS >= 10, 51% >= 15, 0% >= 20 at pqsfinder's default max_len 50
  # (by definition). max_len 70 recovers a PQS >= 20 in 3.5% (long-loop G4s the
  # pipeline cannot see); max_len 100 adds nothing over 70. The same peaks
  # dinucleotide-shuffled reach >= 20 in 48% -- the real sequence is DEPLETED of
  # G4 motifs relative to its own composition.
  relaxed_min_score: 10
  relaxed_max_len: 70
  pqs_thresholds: [10, 15, 20, 30]      # report fraction of peaks with best >= each
  # -- rule 56: half-site scanner (scripts/_shared/half_g4.R) ----------------
  min_run: 3               # G-tract length for the hypothesis tiers (T2/T3/T4)
  gg_min_run: 2            # sensitivity tier (T2gg): GG tracts. Common in any
                           # sequence, so never the headline.
  loop_min: 1
  loop_max: 7              # the canonical G4 loop range (Huppert & Balasubramanian)
  loop_max_sensitivity: 12 # re-counted as a sensitivity row. The crude probe
                           # gave 0.70/kb vs 0.76/kb shuffled at 12 -- same answer.
  null_quantile: 0.95      # "high-confidence" = half_score >= this quantile of the
                           # SAME tier in the shuffled null. Measured at runtime and
                           # written to the rates table, not chosen by eye.
  null_min_sites: 20       # below this many null sites in a tier, the threshold is
                           # taken from the pooled G3 null (T2 + T3) instead
  n_boot: 1000             # peak bootstrap for every rate CI
  expression_genotype: WT  # which group_<genotype> column of
                           # tss_expression_gene_groups.csv labels a gene as
                           # expressed (Q1-Q4) / silent / unknown for the strand test

# ---- Volcano + lncRNA G4 metaprofiles (rules 21-23) -----------------------
lncrna:
  gtf_url:   "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/gencode.vM25.annotation.gtf.gz"
  gtf_local: "data/gencode.vM25.annotation.gtf.gz"
  biotypes:
    - lincRNA
    - antisense
    - processed_transcript
    - sense_intronic
    - sense_overlapping
    - 3prime_overlapping_ncRNA
    - bidirectional_promoter_lncRNA
    - macro_lncRNA
  volcano_label_n: 50

# ---- Dev / smoke-test knob ------------------------------------------------
peak_subsample: null
peak_subsample_seed: 7
