# Environment for the G4ShapePredictor topology step (rule 04).
#
# CRITICAL VERSION PIN: the shipped G4SP model pickles (e.g. "RandomForest
# (default).pkl") were trained with scikit-learn 1.0.2. scikit-learn changed the
# internal decision-tree node-array dtype in 1.3 (added `missing_go_to_left`), so
# a newer sklearn CANNOT unpickle these models — it raises
#   "node array from the pickle has an incompatible dtype".
# We therefore pin sklearn 1.0.2 + numpy<2 + python 3.9 to match the upstream
# environment.yml (python=3.9.7, scikit-learn=1.0.2, numpy=1.26.3). Do NOT relax
# these pins or rule 04 silently falls back to the pqsfinder heuristic.
#
# Build (recreate if it already exists with the wrong versions):
#   conda env remove -n g4sp -y
#   conda env create -f envs/g4sp.yaml
#
# Guaranteed-but-heavy fallback (the authors' exact GUI env) if the pins below
# fail to solve on conda-forge:
#   conda env create -f external/G4ShapePredictor/environment.yml   # name: github-g4predictor
#   # then set  g4sp.conda_env: github-g4predictor  in config/config.yaml
name: g4sp
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - scikit-learn=1.0.2              # MUST match the pickled model's training version
  - "numpy<2"                       # sklearn 1.0.2 was built against numpy 1.x
  - scipy=1.12
  - pandas=2.1
  - joblib=1.3
  - xgboost=1.7                     # only needed for the non-default XGB/LightGBM models
  - biopython
  - pyyaml
  - openpyxl
